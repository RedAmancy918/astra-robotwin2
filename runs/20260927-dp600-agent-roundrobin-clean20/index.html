<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboTwin · 三视角控制</title>
<style>body{margin:0;background:#10171d;color:#e9f0f3;font:16px system-ui;padding:32px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px}small{color:#9bacb8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:24px 0}figure{margin:0;background:#1b2731;border-radius:12px;overflow:hidden}img{width:100%;aspect-ratio:4/3;object-fit:contain}figcaption{padding:12px}.panel{background:#1b2731;padding:20px;border-radius:12px;margin:18px 0}button,select,input{font:inherit;padding:9px 14px;border-radius:7px;border:1px solid #3b505c;background:#233845;color:white;margin:4px}button{cursor:pointer}button:hover{background:#335467}.stop{background:#733a39}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}pre{white-space:pre-wrap;font-size:13px;color:#b9cbd6}#status{color:#8de3cb}a{color:#8de3cb}@media(max-width:900px){.grid{grid-template-columns:1fr}body{padding:16px}}</style>
<header><div><small>is5090 / stack_blocks_two</small><h1>RoboTwin · 三视角控制</h1></div><div id="status">连接中</div></header>
<div class="row"><input id="token" type="password" placeholder="访问令牌"><button onclick="connect()">连接</button><small>画面来自同一仿真；动作之间暂停物理推进。</small></div>
<div class="grid"><figure><img id="head"><figcaption>主摄 · Head</figcaption></figure><figure><img id="left_wrist"><figcaption>左腕 · Left wrist</figcaption></figure><figure><img id="right_wrist"><figcaption>右腕 · Right wrist</figcaption></figure></div>
<div class="panel"><div class="row"><button onclick="claim()">接管控制</button><button class="stop" onclick="hold()">暂停 / 中断 DP</button><button onclick="act('dp')">运行 DP · 最多 12 步</button><button onclick="act('reset')">重置场景</button></div><div class="row"><select id="arm"><option value="left">左手</option><option value="right">右手</option></select><select id="level"><option value="1">5 毫米</option><option value="2">2 厘米</option><option value="3">5 厘米</option></select><span id="controls"></span></div><small>XYZ 为世界坐标，姿态保持不变。接管会取消旧控制者的后续动作。</small><pre id="detail"></pre></div>
<div class="panel"><b>Diffusion Policy 训练</b><pre id="training"></pre></div><pre id="result"></pre>
<script>
const client='browser-'+Math.random().toString(36).slice(2);let token=decodeURIComponent(location.hash.slice(1)),obs=null,running=false,last='';
history.replaceState(null,'',location.pathname);document.getElementById('token').value=token;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.detail||r.status);return d}
function show(e){document.getElementById('result').textContent=typeof e==='string'?e:JSON.stringify(e,null,2)}
function connect(){token=document.getElementById('token').value;refresh()}
async function claim(){try{show(await api('/v1/control/claim',{client_id:client,takeover:true}));await refresh()}catch(e){show(e.message)}}
async function hold(){try{show(await api('/v1/control/hold',{client_id:client}));await refresh()}catch(e){show(e.message)}}
async function act(kind,code){try{if(!obs)throw Error('请先连接');last=crypto.randomUUID();show(await api('/v1/commands',{client_id:client,command_id:last,epoch:obs.epoch,revision:obs.revision,kind,steps:code?[{arm:document.getElementById('arm').value,code,level:+document.getElementById('level').value}]:[],max_actions:12,seed:1000}));await refresh()}catch(e){show(e.message)}}
for(const code of ['X+','X-','Y+','Y-','Z+','Z-','OPEN','CLOSE']){let b=document.createElement('button');b.textContent=({OPEN:'张开',CLOSE:'闭合'})[code]||code;b.onclick=()=>act('eef',code);document.getElementById('controls').append(b)}
async function refresh(){if(!token||running)return;running=true;try{obs=await api('/v1/observe?inline=true');document.getElementById('status').textContent=obs.ready?`${obs.mode} · 帧龄 ${obs.frame_age_s}s`:(obs.error||'仿真初始化中');for(const [k,v] of Object.entries(obs.images||{}))document.getElementById(k).src=v;document.getElementById('detail').textContent=JSON.stringify({控制者:obs.owner,版本:obs.revision,已应用控制代数:obs.applied_epoch,左手:obs.snapshot.left_eef,右手:obs.snapshot.right_eef},null,2);document.getElementById('training').textContent=JSON.stringify(await api('/v1/training'),null,2);if(last)show(await api('/v1/commands/'+last))}catch(e){document.getElementById('status').textContent=e.message}finally{running=false}}
setInterval(refresh,1000);refresh();
</script></html>
